name: Build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: clang++ -dynamiclib -framework Foundation -framework UIKit -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) main.cpp -o VanVinh.dylib
      - name: Save
        uses: actions/upload-artifact@v3
        with:
          name: dylib
          path: VanVinh.dylib
